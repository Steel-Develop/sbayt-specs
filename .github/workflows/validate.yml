name: Validate

on:
  pull_request:
  push:
    branches: [master]
    tags: ["*-v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_PYTHON: 3.12.3

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository and tags
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: 0.11.29
          enable-cache: true

      - name: Validate registry
        run: uv run .github/scripts/validate_registry.py

  publish-tags:
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
    concurrency:
      group: publish-contract-tags
      cancel-in-progress: false
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository and tags
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: 0.11.29
          enable-cache: true

      - name: Publish missing contract tags
        run: uv run .github/scripts/validate_registry.py --publish-tags
